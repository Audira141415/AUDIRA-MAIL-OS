apiVersion: apps/v1
kind: Deployment
metadata:
  name: audira-backend
  namespace: audira-mail-os
spec:
  replicas: 3
  selector:
    matchLabels:
      app: audira-backend
  template:
    metadata:
      labels:
        app: audira-backend
    spec:
      containers:
      - name: audira-backend
        image: audira/backend-api:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: audira-secrets
              key: database-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: audira-backend-service
  namespace: audira-mail-os
spec:
  selector:
    app: audira-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
